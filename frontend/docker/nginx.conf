# Plik trafia do /etc/nginx/conf.d/default.conf, czyli do kontekstu http {} głównej konfiguracji (dlatego map
# może stać poza blokiem server).

# Cache-Control odpowiedzi statycznych: pliki z hashem treści w nazwie (main-AB12CD34.js, chunk-…, styles-…, fonty z
# buildu) mogą być trzymane bez końca, cała reszta (index.html, favicon) jest sprawdzana przy każdym użyciu.
# API ustawia nagłówki samo (pusta wartość - add_header pomija nagłówek). Regex z {8} musi być w cudzysłowie.
map $uri $static_cache_control {
    "~^/api/"                                     "";
    "~*-[A-Za-z0-9_-]{8}\.(?:js|css|woff2)$"      "public, max-age=31536000, immutable";
    default                                       "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # bez wersji nginx w nagłówku Server i na stronach błędów
    server_tokens off;

    # Kompresja odpowiedzi tekstowych (także z API - JSON); Vary: Accept-Encoding dla pośrednich cache
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    # Nagłówki bezpieczeństwa - TYLKO na poziomie server: add_header w bloku location kasuje dziedziczenie wszystkich
    # add_header z poziomu server, dlatego żaden location poniżej nie używa add_header (pilnuje tego NginxConfigTests).
    # "always" - także dla odpowiedzi błędów (4xx/5xx).
    #
    # CSP: skrypty wyłącznie z własnego origin (build bez inline skryptów - angular.json: inlineCritical: false),
    # style inline dozwolone (Angular i Angular Material wstrzykują style komponentów w <style>, build wstawia CSS fontów
    # Google do index.html), fonty Google (CSS z fonts.googleapis.com, pliki z fonts.gstatic.com), obrazy także
    # data:/blob:, żądania XHR tylko do własnego origin (/api), bez osadzania strony w ramkach.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $static_cache_control;

    # upload załączników aplikacji i dokumentów profilu: do 25 MB plików w jednym żądaniu + narzut multipart
    # (limit backendu: 26 MB); bez rozróżniania wielkości liter i z opcjonalnym "/" na końcu - jak routing ASP.NET Core
    location ~* ^/api/(jobapplications/\d+/attachments|account/documents)/?$ {
        proxy_pass http://backend:8080;
        client_max_body_size 26m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nosniff dodaje nginx (wyżej) - bez drugiej kopii nagłówka z backendu
        proxy_hide_header X-Content-Type-Options;
    }

    # pozostałe API przekazywane do kontenera z backendem (limit ciała jak w backendzie: 1 MB)
    location /api/ {
        proxy_pass http://backend:8080;
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nosniff dodaje nginx (wyżej) - bez drugiej kopii nagłówka z backendu
        proxy_hide_header X-Content-Type-Options;
    }

    # routing Angulara (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
