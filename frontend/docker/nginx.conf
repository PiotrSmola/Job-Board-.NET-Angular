server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # upload załączników aplikacji i dokumentów profilu: do 25 MB plików w jednym żądaniu + narzut multipart
    # (limit backendu: 26 MB); bez rozróżniania wielkości liter i z opcjonalnym "/" na końcu - jak routing ASP.NET Core
    location ~* ^/api/(jobapplications/\d+/attachments|account/documents)/?$ {
        proxy_pass http://backend:8080;
        client_max_body_size 26m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # pozostałe API przekazywane do kontenera z backendem (limit ciała jak w backendzie: 1 MB)
    location /api/ {
        proxy_pass http://backend:8080;
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # routing Angulara (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
