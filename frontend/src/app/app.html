<a class="skip-link" href="#main" (click)="skipToMain($event)">Przejdź do treści</a>
<header class="app-header">
  <app-navbar />
  @if (authService.emailConfirmationPending()) {
    <!-- miejsce o minimalnej wysokości od pierwszego renderu – doładowany leniwie baner nie przesuwa treści (CLS) -->

      <ng-container #emailBanner />
    </div>
  }
</header>
<main id="main" class="app-main" tabindex="-1" #main>
  <router-outlet />
</main>
