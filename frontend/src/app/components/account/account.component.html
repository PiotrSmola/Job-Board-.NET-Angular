<div class="page">
  <h1 class="account-title">Moje konto</h1>

  <div class="layout">
    <nav class="section-nav" aria-label="Sekcje konta">
      <ul>
        @for (section of sections; track section.id) {
          <li>
            <a
              class="section-link"
              routerLink="/account"
              [queryParams]="queryParamsFor(section.id)"
              [replaceUrl]="true"
              [attr.aria-current]="current() === section.id ? 'true' : null"
              (click)="select($event, section.id)">{{ section.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="sections">
      @for (section of sections; track section.id) {
        <section class="block account-section" [id]="section.anchor" [attr.aria-labelledby]="section.anchor + '-heading'">
          <h2 class="section-title" [id]="section.anchor + '-heading'" tabindex="-1">{{ section.label }}</h2>
          @switch (section.id) {
            @case ('profile') { <app-profile-tab /> }
            @case ('documents') { <app-documents-tab /> }
            @case ('security') { <app-security-tab /> }
            @case ('notifications') { <app-notifications-tab /> }
          }
        </section>
      }
    </div>
  </div>
</div>
