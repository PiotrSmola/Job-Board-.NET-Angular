<p class="section-intro">CV, list motywacyjny lub portfolio – przy aplikowaniu dołączysz je jednym kliknięciem.</p>

@switch (state()) {
  @case ('loading') {
    <div class="loading" role="status">
      <mat-spinner diameter="32" aria-hidden="true"></mat-spinner>
      <span class="visually-hidden">Wczytywanie dokumentów…</span>
    </div>
  }
  @case ('error') {
    <div class="loading" role="alert">
      <p class="danger-text">{{ loadError() }}</p>
      <button mat-stroked-button type="button" (click)="load()">Spróbuj ponownie</button>
    </div>
  }
  @default {
    <app-attachment-list
      [attachments]="documents()"
      [actions]="listActions"
      [allowDelete]="progress() === null"
      [showDate]="true"
      itemNoun="dokument"
      emptyText="Nie masz jeszcze dokumentów w profilu"
      (deleted)="onDeleted($event)" />

    <h3 class="subheading add-heading">Dodaj pliki</h3>
    <app-attachments-picker
      [items]="items()"
      (itemsChange)="onItemsChange($event)"
      [existing]="documents()"
      [progress]="progress()"
      [errorMessage]="uploadError()"
      [statusMessage]="uploadStatus()"
      limitContext="profile" />

    <!-- przycisk zostaje w DOM (aria-disabled bez plików / w trakcie wysyłania) – fokus nie ginie po wysłaniu -->
    <div class="actions upload-actions">
      <button mat-flat-button type="button" (click)="upload()" [disabled]="!items().length || progress() !== null"
        [disabledInteractive]="true">
        {{ items().length > 1 ? 'Prześlij dokumenty (' + items().length + ')' : 'Prześlij dokument' }}
      </button>
    </div>
  }
}
