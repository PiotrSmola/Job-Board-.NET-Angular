<div class="page">
  <div class="page-header">
    <h1>Panel admina</h1>
  </div>

  <mat-tab-group
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="onTabChange($event)"
    [preserveContent]="true"
    mat-stretch-tabs="false"
    mat-align-tabs="start"
    aria-label="Sekcje panelu">
    <mat-tab label="Statystyki">
      <ng-template matTabContent>
        <!-- Kod wykresów jest ładowany leniwie (osobny chunk) -->
        @defer (on immediate) {
          <app-stats-dashboard mode="admin" />
        } @placeholder {
          <div class="stats-placeholder" role="status">Wczytywanie statystyk…</div>
        }
        <app-admin-pending-companies (changed)="onPendingChanged()" />
      </ng-template>
    </mat-tab>

    <mat-tab label="Oferty">
      <ng-template matTabContent>
        <app-admin-jobs-tab>
          @if (allowSeedRefresh()) {
            <button mat-stroked-button color="warn" type="button" (click)="refreshSeedData()" class="refresh-seed-button"
              [disabled]="refreshingSeed()">
              {{ refreshingSeed() ? 'Przywracanie…' : 'Przywróć dane z seedera' }}
            </button>
          }
        </app-admin-jobs-tab>
      </ng-template>
    </mat-tab>

    <mat-tab label="Aplikacje">
      <ng-template matTabContent>
        <app-admin-applications-tab></app-admin-applications-tab>
      </ng-template>
    </mat-tab>

    <mat-tab label="Firmy">
      <ng-template matTabContent>
        <app-admin-companies-tab></app-admin-companies-tab>
      </ng-template>
    </mat-tab>

    <mat-tab label="Kategorie">
      <ng-template matTabContent>
        <app-admin-categories-tab></app-admin-categories-tab>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
